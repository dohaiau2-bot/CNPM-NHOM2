{% extends "base.html" %}

{% block content %}

<h1 class="mt-4">Các chức năng của thủ thư</h1>

<ol class="breadcrumb mb-4">
    <li class="breadcrumb-item active">Cập nhật thông tin sách</li>
</ol>

<div class="row">
    <!-- CARD 1 -->
    <div class="col-xl-3 col-md-6">
        <div class="card bg-primary text-white mb-4">
            <div class="card-body">THÊM SÁCH</div>
            <div class="card-footer d-flex align-items-center justify-content-between">
                <a class="small text-white stretched-link" href="{{url_for('libary') }}">Chi tiết</a>
                <div class="small text-white">
                    <i class="fas fa-angle-right"></i>
                </div>
            </div>
        </div>
    </div>

    <!-- CARD 2 -->
    <div class="col-xl-3 col-md-6">
        <div class="card bg-warning text-white mb-4">
            <div class="card-body">Cập nhật thông tin sách </div>
            <div class="card-footer d-flex align-items-center justify-content-between">
                <a class="small text-white stretched-link" href="{{ url_for('books_management') }}">View Details</a>
                <div class="small text-white">
                    <i class="fas fa-angle-right"></i>
                </div>
            </div>
        </div>
    </div>
    <div class="col-xl-3 col-md-6">
        <div class="card bg-danger text-white mb-4">
            <div class="card-body">Xóa sách </div>
            <div class="card-footer d-flex align-items-center justify-content-between">
                <a class="small text-white stretched-link" href="#">View Details</a>
                <div class="small text-white">
                    <i class="fas fa-angle-right"></i>
                </div>
            </div>
        </div>
    </div>
</div>
<div class ="card mb-4">
    <div class="card-header">
        <i class="fas fa-table me-1"></i>
        Sách:
    </div>
    <div class ="card-body">
        <table id="datatablesSimple">
            ...
        </table>
    </div>
</div>

<h1 class="mt-4">Danh sách sách</h1>

<div class="container">
    <!-- Bảng sách -->
    <table id="book-block" class="table table-striped table-bordered">
        <!-- Bảng sẽ được JS đổ dữ liệu -->
    </table>
</div>

<script>
    const getBookApi = "{{ url_for('books.get_all_books') }}"; 
    function loadBook() {
        const titleTable = `<thead><tr><th>Id</th><th>Name</th><th>Page Count</th></tr></thead>`;
        fetch(getBookApi)
            .then(response => response.json())
            .then(books => {
                const rows = books.map(book => `
                    <tr>
                        <td>${book.id}</td>
                        <td>${book.name}</td>
                        <td>${book.page_count}</td>
                    </tr>
                `).join('');
                document.getElementById("book-block").innerHTML = titleTable + `<tbody>` + rows + `</tbody>`;
            })
            .catch(error => console.error("Error loading books:", error));
    }

    document.addEventListener('DOMContentLoaded', loadBook);
</script>

{% endblock %}
