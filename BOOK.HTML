{% extends "base.html" %}

{% block title %}Quản lý sách{% endblock %}

{% block content %}
<div class="container-fluid px-4">
    <h1 class="mt-4">Quản lý sách</h1>
    
    <ol class="breadcrumb mb-4">
        <li class="breadcrumb-item"><a href="index.html">Dashboard</a></li>
        <li class="breadcrumb-item active">Sách</li>
    </ol>

    <div class="card mb-4">
        <div class="card-header">
            <i class="fas fa-table me-1"></i>
            Danh sách sách trong thư viện
        </div>
        <div class="card-body">
            <button class="btn btn-primary mb-3" onclick="loadBooks()">
                <i class="fas fa-sync-alt"></i> Tải lại dữ liệu
            </button>
            
            <table class="table table-bordered table-striped table-hover">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Tên sách</th>
                        <th>Số trang</th>
                        <th>Author ID</th>
                        <th>Category ID</th>
                        <th style="width: 150px;">Hành động</th>
                    </tr>
                </thead>
                <tbody id="book-table">
                    </tbody>
            </table>
        </div>
    </div>
</div>

<div class="modal fade" id="editBookModal" tabindex="-1" aria-labelledby="editBookModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="editBookModalLabel">Chỉnh sửa thông tin sách</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="editBookForm">
                    <input type="hidden" id="edit-book-id">

                    <div class="mb-3">
                        <label for="edit-name" class="form-label">Tên sách</label>
                        <input type="text" class="form-control" id="edit-name" required>
                    </div>
                    <div class="mb-3">
                        <label for="edit-page-count" class="form-label">Số trang</label>
                        <input type="number" class="form-control" id="edit-page-count">
                    </div>
                    <div class="mb-3">
                        <label for="edit-author-id" class="form-label">Author ID</label>
                        <input type="number" class="form-control" id="edit-author-id">
                    </div>
                    <div class="mb-3">
                        <label for="edit-category-id" class="form-label">Category ID</label>
                        <input type="number" class="form-control" id="edit-category-id">
                    </div>
                </form>
            </div>
            
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    // 1. Hàm load danh sách sách
    function loadBooks() {
        fetch("/book-management/books")
            .then(res => res.json())
            .then(data => {
                let html = "";
                // Kiểm tra dữ liệu trả về
                if (typeof data === 'string') {
                    // Trường hợp backend trả về chuỗi thông báo lỗi/không tìm thấy
                    document.getElementById("book-table").innerHTML = `<tr><td colspan="6" class="text-center">${data}</td></tr>`;
                    return;
                }

                data.forEach(book => {
                    html += `
                        <tr>
                            <td>${book.id}</td>
                            <td>${book.name}</td>
                            <td>${book.page_count}</td>
                            <td>${book.author_id}</td>
                            <td>${book.category_id}</td>
                            <td>
                                <button class="btn btn-sm btn-warning" onclick="openEditModal(${book.id})">
                                    <i class="fas fa-edit"></i> Sửa
                                </button>
                                <button class="btn btn-sm btn-danger" onclick="deleteBook(${book.id})">
                                    <i class="fas fa-trash"></i> Xóa
                                </button>
                            </td>
                        </tr>
                    `;
                });
                document.getElementById("book-table").innerHTML = html;
            })
            .catch(err => console.error("Lỗi loading books:", err));
    }

    // 2. Hàm mở Modal và điền thông tin cũ
    function openEditModal(id) {
        fetch(`/book-management/book/id/${id}`)
            .then(res => res.json())
            .then(book => {
                if(book) {
                    // Điền dữ liệu vào form
                    document.getElementById('edit-book-id').value = book.id;
                    document.getElementById('edit-name').value = book.name;
                    document.getElementById('edit-page-count').value = book.page_count;
                    document.getElementById('edit-author-id').value = book.author_id;
                    document.getElementById('edit-category-id').value = book.category_id;

                    // Mở Modal (Sử dụng Bootstrap 5 API đã có trong base.html)
                    const myModal = new bootstrap.Modal(document.getElementById('editBookModal'));
                    myModal.show();
                }
            })
            .catch(err => alert("Không lấy được thông tin sách!"));
    }

    // 3. Hàm lưu thay đổi (Gửi Request PUT)
    function saveBookChanges() {
        const id = document.getElementById('edit-book-id').value;
        const data = {
            name: document.getElementById('edit-name').value,
            page_count: parseInt(document.getElementById('edit-page-count').value),
            author_id: parseInt(document.getElementById('edit-author-id').value),
            category_id: parseInt(document.getElementById('edit-category-id').value)
        };

        fetch(`/book-management/book/${id}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        })
        .then(res => {
            if (res.ok) {
                alert("Cập nhật thành công!");
                
                // Ẩn modal
                // Lưu ý: Cần lấy đúng instance của modal để ẩn
                const modalEl = document.getElementById('editBookModal');
                const modalInstance = bootstrap.Modal.getInstance(modalEl); 
                if (modalInstance) {
                    modalInstance.hide();
                }

                // Load lại bảng
                loadBooks();
            } else {
                alert("Cập nhật thất bại!");
            }
        })
        .catch(err => console.error("Lỗi update:", err));
    }

    // 4. Hàm xóa sách
    function deleteBook(id) {
        if(confirm("Bạn có chắc muốn xóa sách ID: " + id + " không?")) {
            fetch(`/book-management/book/${id}`, { method: 'DELETE' })
            .then(res => {
                // Backend của bạn trả về chuỗi text, không phải json trong hàm delete
                // nhưng fetch vẫn xử lý ok nếu status code 200
                if (res.ok) {
                    alert("Đã xóa sách!");
                    loadBooks();
                } else {
                    alert("Lỗi khi xóa sách");
                }
            })
            .catch(err => console.error(err));
        }
    }

    // Tự động load dữ liệu khi trang web tải xong
    document.addEventListener('DOMContentLoaded', function() {
        loadBooks();
    });
</script>
{% endblock %}
