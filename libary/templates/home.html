<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
</head>
<style>
    body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #9faef1 0%, #912ef3 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: rgba(255, 255, 255, 0.15);
            padding: 40px;
            border-radius: 20px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            text-align: center;
            width: 350px;
        }

        h1 {
            color: white;
            margin-bottom: 25px;
            font-size: 24px;
        }

        .btn {
            display: block;
            text-decoration: none;
            background: linear-gradient(135deg, #06b6d4, #6366f1);
            color: white;
            padding: 14px;
            border-radius: 12px;
            margin: 12px 0;
            font-weight: 600;
            transition: 0.3s;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0px 8px 25px rgba(205, 205, 221, 0.897);
        }
</style>

<body>
    <div class="container">
    <h1>Thư viện Đhsp Huế</h1>
    <a class ="btn" href="{{ url_for('login') }}">TRANG ĐĂNG NHẬP</a><br>
    <a class ="btn" href="{{ url_for('register') }}">TRANG ĐĂNG KÝ</a><br>
    </div>
</body>

</html>

</html>
